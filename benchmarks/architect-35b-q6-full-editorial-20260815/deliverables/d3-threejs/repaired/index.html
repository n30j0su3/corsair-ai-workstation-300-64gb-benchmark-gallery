<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medieval Forest</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #111; font-family: sans-serif; }
#scene { width: 100vw; height: 100vh; position: relative; }
#scene canvas { display: block; width: 100%; height: 100%; }
#ui { position: fixed; top: 10px; left: 10px; z-index: 10; display: flex; gap: 10px; align-items: center; }
button { background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #555; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-size: 14px; }
button:hover { background: rgba(50,50,50,0.8); }
#scene-status { color: #aaa; font-size: 14px; }
#fallback { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; color: #fff; justify-content: center; align-items: center; font-size: 24px; z-index: 100; }
</style>
</head>
<body>
<div id="ui">
  <button id="reset-camera">Reset Camera</button>
  <button id="quality-toggle">Toggle Quality</button>
  <span id="scene-status">quality-low</span>
</div>
<div id="fallback">WebGL not supported. Please use a modern browser.</div>
<div id="scene"></div>
<script src="./vendor/three.min.js"></script>
<script>
(function() {
  const sceneEl = document.getElementById('scene');
  const canvas = document.createElement('canvas');
  sceneEl.appendChild(canvas);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.4;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x3a3a5e);
  scene.fog = new THREE.FogExp2(0x3a3a5e, 0.012);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 5, 15);
  camera.lookAt(0, 2, 0);

  // Sky dome
  const skyGeo = new THREE.SphereGeometry(100, 32, 32);
  const skyMat = new THREE.MeshBasicMaterial({ color: 0x3a3a5e, side: THREE.BackSide });
  const sky = new THREE.Mesh(skyGeo, skyMat);
  scene.add(sky);

  // Ground
  const groundGeo = new THREE.PlaneGeometry(200, 200, 64, 64);
  const posAttr = groundGeo.attributes.position;
  for (let i = 0; i < posAttr.count; i++) {
    const x = posAttr.getX(i);
    const y = posAttr.getY(i);
    posAttr.setZ(i, (Math.sin(x * 0.1) * Math.cos(y * 0.1) * 0.5 + Math.random() * 0.2));
  }
  groundGeo.computeVertexNormals();
  const groundMat = new THREE.MeshStandardMaterial({ color: 0x6a8a5e, roughness: 0.9, metalness: 0.0 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // Path
  const pathGeo = new THREE.PlaneGeometry(3, 60, 1, 1);
  const pathMat = new THREE.MeshStandardMaterial({ color: 0x9a8a7a, roughness: 0.8 });
  const path = new THREE.Mesh(pathGeo, pathMat);
  path.rotation.x = -Math.PI / 2;
  path.position.y = 0.05;
  path.receiveShadow = true;
  scene.add(path);

  // Moonlight
  const moonLight = new THREE.DirectionalLight(0xccddee, 1.0);
  moonLight.position.set(20, 30, 10);
  moonLight.castShadow = true;
  moonLight.shadow.mapSize.width = 1024;
  moonLight.shadow.mapSize.height = 1024;
  moonLight.shadow.camera.near = 0.5;
  moonLight.shadow.camera.far = 80;
  moonLight.shadow.camera.left = -30;
  moonLight.shadow.camera.right = 30;
  moonLight.shadow.camera.top = 30;
  moonLight.shadow.camera.bottom = -30;
  scene.add(moonLight);

  // Ambient
  const ambientLight = new THREE.AmbientLight(0x778899, 0.5);
  scene.add(ambientLight);

  // Fireflies
  const fireflyCount = 40;
  const fireflyGeo = new THREE.BufferGeometry();
  const fireflyPositions = new Float32Array(fireflyCount * 3);
  const fireflySizes = new Float32Array(fireflyCount);
  for (let i = 0; i < fireflyCount; i++) {
    fireflyPositions[i * 3] = (Math.random() - 0.5) * 40;
    fireflyPositions[i * 3 + 1] = 1 + Math.random() * 4;
    fireflyPositions[i * 3 + 2] = (Math.random() - 0.5) * 40;
    fireflySizes[i] = 0.5 + Math.random() * 1.5;
  }
  fireflyGeo.setAttribute('position', new THREE.BufferAttribute(fireflyPositions, 3));
  fireflyGeo.setAttribute('size', new THREE.BufferAttribute(fireflySizes, 1));

  const fireflyMat = new THREE.PointsMaterial({
    color: 0xffee88,
    size: 0.3,
    transparent: true,
    opacity: 0.8,
    sizeAttenuation: true
  });
  const fireflies = new THREE.Points(fireflyGeo, fireflyMat);
  scene.add(fireflies);

  // Point lights for fireflies
  const pointLights = [];
  for (let i = 0; i < 5; i++) {
    const pl = new THREE.PointLight(0xffaa44, 0.5, 10);
    pl.position.set((Math.random() - 0.5) * 20, 1 + Math.random() * 2, (Math.random() - 0.5) * 20);
    scene.add(pl);
    pointLights.push(pl);
  }

  // Trees
  function createTree(x, z, scale) {
    const group = new THREE.Group();

    // Trunk
    const trunkGeo = new THREE.CylinderGeometry(0.15 * scale, 0.25 * scale, 3 * scale, 8);
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8a7560, roughness: 0.9 });
    const trunk = new THREE.Mesh(trunkGeo, trunkMat);
    trunk.position.y = 1.5 * scale;
    trunk.castShadow = true;
    group.add(trunk);

    // Foliage layers
    const foliageColors = [0x5a7a5a, 0x6a8a6a, 0x4a6a4a];
    for (let i = 0; i < 3; i++) {
      const fGeo = new THREE.ConeGeometry((1.5 - i * 0.3) * scale, 2 * scale, 8);
      const fMat = new THREE.MeshStandardMaterial({ color: foliageColors[i], roughness: 0.8 });
      const foliage = new THREE.Mesh(fGeo, fMat);
      foliage.position.y = (3 + i * 1.2) * scale;
      foliage.castShadow = true;
      group.add(foliage);
    }

    group.position.set(x, 0, z);
    return group;
  }

  // Place trees
  const treePositions = [];
  for (let i = 0; i < 60; i++) {
    let x, z;
    let valid = false;
    while (!valid) {
      x = (Math.random() - 0.5) * 60;
      z = (Math.random() - 0.5) * 60;
      // Avoid path
      if (Math.abs(x) < 2.5) continue;
      // Avoid overlap
      let overlap = false;
      for (const tp of treePositions) {
        if (Math.hypot(x - tp.x, z - tp.z) < 2) { overlap = true; break; }
      }
      if (!overlap) valid = true;
    }
    treePositions.push({ x, z });
    const scale = 0.8 + Math.random() * 0.6;
    scene.add(createTree(x, z, scale));
  }

  // Rocks
  for (let i = 0; i < 20; i++) {
    const rGeo = new THREE.DodecahedronGeometry(0.3 + Math.random() * 0.5, 1);
    const rMat = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.9 });
    const rock = new THREE.Mesh(rGeo, rMat);
    rock.position.set((Math.random() - 0.5) * 40, 0.2, (Math.random() - 0.5) * 40);
    rock.rotation.set(Math.random(), Math.random(), Math.random());
    rock.castShadow = true;
    rock.receiveShadow = true;
    scene.add(rock);
  }

  // Emissive accents (glowing mushrooms)
  for (let i = 0; i < 10; i++) {
    const mGeo = new THREE.SphereGeometry(0.1, 8, 8);
    const mMat = new THREE.MeshStandardMaterial({ color: 0x44ffaa, emissive: 0x44ffaa, emissiveIntensity: 2 });
    const mushroom = new THREE.Mesh(mGeo, mMat);
    mushroom.position.set((Math.random() - 0.5) * 30, 0.15, (Math.random() - 0.5) * 30);
    scene.add(mushroom);
  }

  // Quality toggle
  let highQuality = false;
  const statusEl = document.getElementById('scene-status');
  const qualityBtn = document.getElementById('quality-toggle');
  qualityBtn.addEventListener('click', () => {
    highQuality = !highQuality;
    statusEl.textContent = 'quality-high';
    renderer.shadowMap.enabled = highQuality;
    renderer.shadowMap.type = highQuality ? THREE.PCFSoftShadowMap : THREE.BasicShadowMap;
    renderer.toneMappingExposure = highQuality ? 1.5 : 1.0;
    moonLight.intensity = highQuality ? 1.2 : 0.5;
    ambientLight.intensity = highQuality ? 0.6 : 0.3;
    fireflyMat.opacity = highQuality ? 1.0 : 0.5;
    fireflyMat.size = highQuality ? 0.4 : 0.2;
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Reset camera
  document.getElementById('reset-camera').addEventListener('click', () => {
    camera.position.set(0, 5, 15);
    camera.lookAt(0, 2, 0);
  });

  // Resize
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Animation
  let time = 0;
  function animate() {
    requestAnimationFrame(animate);
    time += 0.01;

    // Animate fireflies
    const positions = fireflies.geometry.attributes.position.array;
    for (let i = 0; i < fireflyCount; i++) {
      positions[i * 3] += Math.sin(time * 2 + i) * 0.01;
      positions[i * 3 + 1] += Math.cos(time * 1.5 + i) * 0.005;
      positions[i * 3 + 2] += Math.cos(time * 2 + i) * 0.01;
    }
    fireflies.geometry.attributes.position.needsUpdate = true;

    // Animate point lights
    for (let i = 0; i < pointLights.length; i++) {
      pointLights[i].intensity = 0.3 + Math.sin(time * 3 + i * 2) * 0.2;
    }

    renderer.render(scene, camera);
  }

  // Check WebGL support
  if (!renderer.capabilities.isWebGL2 && !renderer.capabilities.isWebGL) {
    document.getElementById('fallback').style.display = 'flex';
  } else {
    window.sceneReady = true;
    animate();
  }
})();
</script>
</body>
</html>
