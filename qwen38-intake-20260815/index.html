<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qwen3.8 27B · MiniV intake</title><style>
:root{--bg:#080b0d;--panel:#101519;--ink:#f4f7f7;--muted:#91a0a7;--line:#263238;--a:#59e4d1;--b:#ffad66;--good:#b8ef72;--warn:#ffd166}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui}a{color:var(--a)}.wrap{width:min(1180px,calc(100% - 40px));margin:auto}.top{padding:24px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}.top a{text-decoration:none}.hero{padding:86px 0 66px;border-bottom:3px solid var(--b);display:grid;grid-template-columns:1.45fr .75fr;gap:50px;align-items:end}.eyebrow{font:700 10px/1.3 ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--a)}h1{font-size:clamp(48px,8vw,105px);line-height:.9;letter-spacing:-.065em;margin:18px 0 22px}.lede{font-size:18px;color:#a7bdc6;max-width:690px}.verdict{border-left:3px solid var(--warn);padding-left:22px}.verdict b{font-size:28px}.section{padding:64px 0;border-bottom:1px solid var(--line)}h2{font-size:clamp(32px,5vw,58px);line-height:.95;letter-spacing:-.05em;margin:12px 0 30px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}.card{background:var(--panel);padding:28px}.card h3{font-size:28px;margin:8px 0}.status{font:700 10px ui-monospace,monospace;letter-spacing:.12em;color:var(--warn);border-left:2px solid currentColor;padding-left:8px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:28px}.metric b{font-size:38px;line-height:1;color:var(--ink)}.metric span{display:block;color:var(--muted);font-size:12px}.bar{height:8px;background:#1d282d;margin:12px 0}.bar i{display:block;height:100%;background:var(--a)}.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.step{border-top:2px solid var(--line);padding-top:18px}.step.good{border-color:var(--good)}.step.warn{border-color:var(--warn)}.step strong{display:block;font-size:20px}.list{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}.list ul{margin:0;padding-left:18px;color:#a7bdc6}.list h3{font-size:16px}.foot{padding:32px 0;color:var(--muted);font-size:12px}.loading{padding:80px 0;color:var(--muted)}@media(max-width:760px){.wrap{width:min(100% - 28px,1180px)}.hero,.grid,.flow,.list{grid-template-columns:1fr}.hero{padding:56px 0}.section{padding:48px 0}.top{font-size:12px}.metrics{grid-template-columns:1fr 1fr}.card{padding:22px}}
</style></head><body><div class="wrap"><header class="top"><a href="../">← Gallery index</a><span>FreakingJSON · MiniV · public evidence</span></header><main id="app"><p class="loading">Loading verified evidence…</p></main><footer class="foot">No cloud inference · no synthetic ranking · missing gates remain pending.</footer></div><script>
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Security boundary: data.json is same-origin, version-controlled evidence; every interpolated string is escaped and numeric CSS is clamped.
fetch('data.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{const [q4,q6]=d.models;document.querySelector('#app').innerHTML=`
<section class="hero"><div><div class="eyebrow">Qwen3.8 27B · intake ${esc(d.updated)}</div><h1>Candidate.<br>Not default.</h1><p class="lede">Tool calling and code gates pass. MTP delivers a material decode uplift. Full editorial, long context and runtime-upgrade canaries decide promotion.</p></div><div class="verdict"><div class="eyebrow">Current routing</div><b>Architect remains default.</b><p>Q4/Q6 stay bounded candidates until every applicable gate is terminal.</p></div></section>
<section class="section"><div class="eyebrow">01 / measured lanes</div><h2>Two quants. Two jobs.</h2><div class="grid">${[q4,q6].map(m=>`<article class="card"><div class="status">${esc(m.state)}</div><h3>${esc(m.id)}</h3><p>${esc(m.quant)} · tool ${esc(m.tool_call)} · code ${esc(m.code_tests)}</p><div class="metrics"><div class="metric"><b>${esc(m.decode_mtp_tps.toFixed(2))}</b><span>decode tok/s with MTP</span></div><div class="metric"><b>+${esc(m.mtp_delta_pct.toFixed(1))}%</b><span>MTP uplift vs baseline</span></div><div class="metric"><b>${esc(m.prefill_3304_tps.toFixed(1))}</b><span>prefill tok/s @ 3.3K</span></div><div class="metric"><b>${esc(m.full_editorial)}</b><span>full editorial state</span></div></div><div class="bar"><i style="width:${Math.min(100,m.mtp_delta_pct)}%"></i></div></article>`).join('')}</div></section>
<section class="section"><div class="eyebrow">02 / Pi forensic</div><h2>Two failures. Different causes.</h2><div class="flow"><div class="step warn"><strong>pi-fast</strong><p><code>--no-tools</code> disabled tools by wrapper policy. This was not a model failure.</p></div><div class="step good"><strong>pi normal</strong><p>Tool calls passed with the same model family.</p></div><div class="step warn"><strong>Session end</strong><p>${esc(d.pi_forensics.request_tokens)} prompt tokens exceeded ${esc(d.pi_forensics.available_context_tokens)}. Compact-and-retry could not recover.</p></div></div></section>
<section class="section"><div class="eyebrow">03 / configuration review</div><h2>Keep evidence. Reject folklore.</h2><div class="list"><div><h3>Adopted</h3><ul>${d.external_report_assessment.adopted.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><h3>Already stronger locally</h3><ul>${d.external_report_assessment.already_better_locally.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><h3>Canary only</h3><ul>${d.external_report_assessment.requires_local_canary.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><h3>Recipe corrections</h3><ul>${d.external_report_assessment.recipe_corrections.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div></section>
<section class="section"><div class="eyebrow">04 / runtime</div><h2>${esc(d.runtime.production_build)} → ${esc(d.runtime.candidate_build)}</h2><p class="lede">The candidate builds side-by-side. It cannot replace production until Qwen3.8, Architect, tools, context and rollback gates pass.</p><p>${esc(d.ranking_policy)}</p></section>`}).catch(e=>document.querySelector('#app').innerHTML=`<p class="loading">Evidence failed to load: ${esc(e.message)}</p>`);
</script></body></html>
